plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.share'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':log')          // LogStore(分享/导入导出留痕)
    implementation project(':common')       // 纯模型/工具
    implementation project(':core-network') // NetworkProvider(统一 OkHttp 客户端,不自行 new Builder)
    implementation project(':core-storage') // PrefsDataStore(在线平台配置/匿名身份令牌)
    // 实现细节不外泄(AGENTS §六:依赖默认 implementation)
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
