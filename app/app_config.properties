# ============================================================
# MBox 应用发布配置(唯一维护入口)
# 修改任意项后重新构建即可生效,无需改动代码/资源文件
# ============================================================

# ---- 版本号(每次发布升级时递增) ----
# versionCode:Android 内部版本号,必须单调递增(整数)
versionCode=67
# versionName:展示给用户的版本名,如 3.2.0
versionName=3.5.10

# ---- 应用名称(桌面图标下的显示名) ----
appName=MBox

# ---- 应用图标(资源引用,支持 drawable 或 mipmap) ----
# 例:@drawable/app_icon 表示 res/drawable-*/app_icon.png
# 当前图标=矢量 drawable/app_icon.xml(素材 D:\Code\Video\icon\用户空空的.svg,已按要求去掉猫底椭圆灰色阴影)
# 换图标:替换对应密度目录的图片文件,或新建资源并改此处引用
appIcon=@drawable/app_icon
