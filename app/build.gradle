// ------------------------------------------------------------------
// 发布配置:版本号/应用名/图标统一由 app_config.properties 维护,
// 修改该文件后重新构建即可,无需改动 build.gradle 与资源。
// ------------------------------------------------------------------
def appConfig = new Properties()
def appConfigFile = file('app_config.properties')
if (appConfigFile.exists()) {
    appConfigFile.withInputStream { ins ->
        // 跳过 UTF-8 BOM(记事本等工具保存 UTF-8 时可能带 BOM),避免污染第一个键
        ins.mark(3)
        if (ins.read() != 0xEF || ins.read() != 0xBB || ins.read() != 0xBF) {
            ins.reset()
        }
        appConfig.load(new InputStreamReader(ins, 'UTF-8'))
    }
}
def cfgVersionCode = (appConfig.getProperty('versionCode', '41') ?: '41').toInteger()
def cfgVersionName = appConfig.getProperty('versionName', '2.2.0') ?: '2.2.0'
def cfgAppName = appConfig.getProperty('appName', 'MBox') ?: 'MBox'
def cfgAppIcon = appConfig.getProperty('appIcon', '@drawable/app_icon') ?: '@drawable/app_icon'

/** debug 包用小一档的版本号(末段 -1,如 3.4.6 → 3.4.5),使 debug 内"检查更新"能检测到当前 release 并触发下载自测 */
def debugVersionName(String releaseName) {
    def parts = (releaseName ?: '').trim().split(/\./)
    if (parts.length < 3) return releaseName
    def last = parts[parts.length - 1].isInteger() ? parts[parts.length - 1].toInteger() : -1
    if (last > 1) {
        parts[parts.length - 1] = String.valueOf(last - 1)
    }
    return parts.join('.')
}


// ------------------------------------------------------------------
// 主题与公共资源自持(3.7② 建 :ui-common 模块,后已整体并入 :app):
// 主题资源(theme_colors/theme_radii/样式/公共 drawable)与页面级资源现在同在 app 的 res,
// 主题 JSON 统一维护于 app/src/main/assets/theme/。
// ------------------------------------------------------------------
android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        // 专属包名:与 TVBox 系开源应用通用的 com.github.tvbox.osc 区分开,
        // 保证本包可与已安装的其他开源 TVBox 应用共存安装、互不冲突。
        // (namespace 保持不变,代码包/资源引用均不受影响)
        applicationId 'com.github.tvbox.osc.mbox'
        minSdk 24
        targetSdk 34
        versionCode cfgVersionCode
        versionName cfgVersionName
        // 应用名与图标来自 app_config.properties(集中配置)
        resValue "string", "app_name", cfgAppName
        manifestPlaceholders = [appIcon: cfgAppIcon]
        multiDexEnabled true
        // 仅保留中文本地化,减小 APK 体积(未翻译文案自动回退到默认 values/)
        resConfigs 'zh-rCN', 'zh'

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            // debug 包版本号小一档(如 3.4.5):便于从 debug 包触发对 release(3.4.6)的"检查更新→下载"自测
            String vn = cfgVersionName
            if (variant.buildType.name == buildTypes.debug.getName()) {
                vn = debugVersionName(cfgVersionName)
                output.versionNameOverride = vn
            }
            outputFileName = cfgAppName + '_v' + vn + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    // ------------------------------------------------------------------
    // 签名:密钥一律不入库(见 .gitignore:*.jks / keystore.properties 已忽略)。
    // 本项目正式密钥:仓库根目录 mbox-release.jks(2025 年生成,全新建库,
    //   不再使用 TVBox 开源圈流传/曾泄露的 TVBoxOSC.jks),
    //   本地读取 app/keystore.properties(不入库,storeFile=../mbox-release.jks)。
    // 读取顺序:环境变量 > keystore.properties(不入库) > 默认占位。
    // 任一密钥缺失时自动退回 debug 签名,保证本地/CI 都能出包;
    // 正式发布请在 CI 通过 secret 注入(GitHub Secrets: KEYSTORE_BASE64 /
    //   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,见 .github/workflows/build-apk.yml)。
    // ------------------------------------------------------------------
    def env = System.getenv()
    // 变量刻意不与 signingConfig 属性(storeFile/storePassword/keyAlias/keyPassword)同名,
    // 否则 Groovy DSL 下 `keyAlias keyAlias` 会把同名局部变量当方法调用而报错(曾踩坑)。
    def ksFile = env['KEYSTORE_FILE'] ?: ''
    def ksStorePassword = env['KEYSTORE_PASSWORD'] ?: ''
    def ksKeyAlias = env['KEY_ALIAS'] ?: ''
    def ksKeyPassword = env['KEY_PASSWORD'] ?: ''
    def keystoreProps = file('keystore.properties')
    if (keystoreProps.exists()) {
        def props = new Properties()
        keystoreProps.withInputStream { ins -> props.load(ins) }
        if (ksFile.isEmpty()) ksFile = props.getProperty('storeFile', '')
        if (ksStorePassword.isEmpty()) ksStorePassword = props.getProperty('storePassword', '')
        if (ksKeyAlias.isEmpty()) ksKeyAlias = props.getProperty('keyAlias', '')
        if (ksKeyPassword.isEmpty()) ksKeyPassword = props.getProperty('keyPassword', '')
    }
    def hasSigning = !ksFile.isEmpty() && !ksStorePassword.isEmpty()
            && !ksKeyAlias.isEmpty() && !ksKeyPassword.isEmpty()
    def signFile = hasSigning ? file(ksFile) : null
    def canSign = hasSigning && signFile != null && signFile.exists()

    if (!canSign && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
        println "WARN: 未检测到正式签名密钥(环境变量或 app/keystore.properties 缺失)," +
                "本次 release 将退回 debug 签名(仅测试用,勿对外分发)!"
    }

    signingConfigs {
        config {
            if (canSign) {
                storeFile signFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            // 调试包使用独立包名,可与设备上已安装的同包名应用共存(避免签名不一致需卸载旧应用)
            applicationIdSuffix ".debug"
            // 调试包应用名带 " debug" 后缀:桌面图标与首页/我的页标题一眼可辨
            // (resValue 优先级高于 res 文件,此处覆盖 defaultConfig 的 app_name)
            resValue "string", "app_name", cfgAppName + " debug"
        }

        release {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }
}

