// ---- 读取主题文件 ----
// 颜色键:只认默认表里的键(类型按默认值);desc:每个键一句说明(可选,写进生成的 XML 注释,
// 将来做"用户自定义主题"界面时就是每个色块下面的说明文字)。手改文件写错键名/漏写说明都会 WARN。
static def readTheme(def file, def defaults) {
    def colors = new LinkedHashMap(defaults)
    def desc = [:]
    if (!file.exists()) return [colors: colors, desc: desc]
    try {
        // 必须显式按 UTF-8 读:主题文件里有中文说明(desc),走平台默认编码(Windows 下可能是 GBK)会读成乱码
        def json = new groovy.json.JsonSlurper().parseText(file.getText('UTF-8'))
        colors.each { k, v ->
            def uv = json[k]
            if (v instanceof Number) {
                if (uv instanceof Number) colors[k] = ((Number) uv).intValue()
            } else if (uv instanceof String && uv.startsWith('#')) {
                colors[k] = uv
            }
        }
        // 元信息与背景配置不参与颜色派生,也不该被"不认识的键"告警误伤
        def unknown = json.keySet().findAll { !(it in ['type', 'name', 'default', 'background', 'splashBackground', 'desc']) && !defaults.containsKey(it) }
        if (unknown) println "WARN: ${file.name} 里有不认识的键(已忽略): ${unknown.join(', ')}"
        def d = json['desc']
        if (d instanceof Map) d.each { k, v -> if (v instanceof String) desc[k] = v }
        def staleDesc = desc.keySet().findAll { !defaults.containsKey(it)
                && !(it == 'background' && json['background'] instanceof Map)
                && !(it == 'splashBackground' && json['splashBackground'] instanceof Map) }
        if (staleDesc) println "WARN: ${file.name} 的 desc 里有不存在的键: ${staleDesc.join(', ')}"
        def noDesc = defaults.keySet().findAll { !desc.containsKey(it) }
        if (noDesc) println "WARN: ${file.name} 的 desc 缺少这些键的说明: ${noDesc.join(', ')}"
    } catch (Throwable th) {
        println "WARN: ${file.name} 解析失败,使用内置默认颜色: ${th.message}"
    }
    return [colors: colors, desc: desc]
}

/** 预设目录是文件发现入口;每种明暗必须且只能有一份默认预设。 */
static File defaultThemeFile(File root, String type) {
    File dir = new File(root, type)
    File[] files = dir.listFiles({ File f -> f.isFile() && f.name.endsWith('.json') } as FileFilter)
    if (files == null || files.length == 0) throw new GradleException("缺少 ${type} 主题预设:${dir}")
    File selected = null
    Set<String> names = new HashSet<>()
    files.sort { a, b -> a.name <=> b.name }.each { File f ->
        def json = new groovy.json.JsonSlurper().parseText(f.getText('UTF-8'))
        if (!(json instanceof Map) || json.type != type || !(json.name instanceof String)
                || json.name.trim().isEmpty() || !(json.default instanceof Boolean)) {
            throw new GradleException("预设 ${f} 必须包含 type=${type}、非空 name 和布尔 default")
        }
        if (!names.add(json.name.trim())) throw new GradleException("${type} 预设名称重复:${json.name}")
        if (json.default) {
            if (selected != null) throw new GradleException("${type} 有多份 default=true:${selected.name}, ${f.name}")
            selected = f
        }
    }
    if (selected == null) throw new GradleException("${type} 没有 default=true 的预设")
    return selected
}

/** '#RRGGBB' / '#AARRGGBB' -> 0xAARRGGBB;非法值回退 fallback(入参用 def:Groovy 把 8 位十六进制字面量当 Long) */
static int parseColor(def value, def fallback) {
    int fb = ((Number) fallback).intValue()
    if (!(value instanceof String)) return fb
    String hex = ((String) value).trim().replace('#', '')
    try {
        if (hex.length() == 6) return (int) (0xFF000000L | Long.parseLong(hex, 16))
        if (hex.length() == 8) return (int) Long.parseLong(hex, 16)
    } catch (Throwable ignored) {
    }
    return fb
}

/** 写出 '#RRGGBB'(不透明)或 '#AARRGGBB'(带透明度) */
static String toHex(def argbRaw) {
    int argb = ((Number) argbRaw).intValue()
    return ((argb >>> 24) & 0xFF) == 0xFF
            ? String.format('#%06X', argb & 0xFFFFFF)
            : String.format('#%08X', argb)
}

/** 透明度百分比(0-100)-> 0..1;入参用 def 再归一化(Groovy 数字字面量可能是 Long/BigDecimal,写死形参会签名不匹配) */
static float percent(def value, def fallback) {
    int p = (value instanceof Number) ? ((Number) value).intValue() : ((Number) fallback).intValue()
    return Math.max(0, Math.min(100, p)) / 100f
}

static int withAlpha(def colorRaw, def alphaRaw) {
    int color = ((Number) colorRaw).intValue()
    int a = Math.round(Math.max(0f, Math.min(1f, ((Number) alphaRaw).floatValue())) * 255f)
    return (a << 24) | (color & 0xFFFFFF)
}

// ---- 派生规则表 ----
// 面:**颜色只有一个**(bg_surface),页面层与浮层共用,避免同屏深浅不一;
//   **透明度是两档,分层不同**(用户口径,原来接反过一次):
//     bg_card_alpha  → **页面层**:bg_surface(页面卡片·标题栏·底栏·搜索框)、
//                      bg_card(海报占位、筛选块、以及**卡片里面的行** —— 弹窗列表行 bg_small_round_gray 等);
//     bg_float_alpha → **浮层**:bg_float(所有弹窗与抽屉、长按/上次看到的气泡、首页直播·筛选悬浮钮与更新悬浮圈)。
//   一句话:页面上的东西(含卡片里的 item)跟 bg_card_alpha;浮起来的那一层跟 bg_float_alpha。
// 同值别名(不占配置):
//   color_highlight / select_fill / btn_plain_text / text_accent = brand(文字主色)
//   btn_select_bg / btn_select_stroke = btn_confirm_bg(实心按钮与选中项共用)
//   btn_select_text = btn_confirm_text
//   btn_stroke      = btn_cancel_bg(无文字描边容器与输入框用;历史资源名,值同源)
//   switch_track_on = download_done = success(正向状态色:开关打开 / 下载完成 —— 原本是两个键,值一直相同)
// 按钮取色口径(用户口径):
//   ① 纯色按钮:底与描边 = 独立配置且不透明的 btn_confirm_bg
//   ② 空心按钮:无填充,1dp 描边与文字同取 brand;按下仍不填充
//   ③ 小组件按钮:未选中描边与文字同取 brand,按下仍不填充;选中态用 btn_confirm_bg 实心填充
// 不派生的固定色:text_danger / swipe_red / swipe_red_text 已写死在 res/values/colors.xml(不随主题)
static def derivePalette(def c) {
    // 文字主色**强制纯色**(alpha 归 100):用户口径"文字主色不允许设置透明度,只能纯色" ——
    // 它是正文、空心与纯文字按钮的文字、勾选框与进度条填充,还是次要/禁用两级的计算来源。
    int brand = withAlpha(parseColor(c.brand, 0xFF1F2937), 1f)
    // 次要文字 / 禁用文字不再单独配:同一个值 = 文字主色 @60%(用户口径"这两块的文字颜色通过计算获得,
    // 其值为文字主色透明度 60%")。资源名 text_sub / text_disable 照旧生成,布局与代码不用改。
    // 注意 Gradle 侧 withAlpha 收的是 0..1 的比例(运行时 ThemePaletteFactory 收 0-100,两边必须同口径)
    int textSub = withAlpha(brand, 0.6f)
    // 占位/提示文字:文字主色 @40%(与运行时 ThemePaletteFactory 同口径)
    int textHint = withAlpha(brand, 0.4f)
    // 「文字主色 50%」:给"链接/地址"这类要压一档、又要跟主色同系的文字(如订阅管理里的订阅地址)。
    // 与 text_sub(60%)分开是因为用户对链接明确要求 50%,别再各自写透明度。
    int textMainHalf = withAlpha(brand, 0.5f)
    // 纯色按钮与选中项的填充、描边同取独立且不透明的实心按钮底色。
    int confirmBg = parseColor(c.btn_confirm_bg, brand)
    if ((confirmBg >>> 24) != 0xFF) confirmBg = brand
    int confirmText = parseColor(c.btn_confirm_text, 0xFFFFFFFF)
    int highlightText = parseColor(c.text_highlight, 0xFF1890FF)
    int hollowStroke = parseColor(c.btn_cancel_bg, 0xFF661F2937)
    // 同一个颜色、两档透明度:页面层(bg_card_alpha)与浮层(bg_float_alpha)
    int surfaceColor = parseColor(c.bg_surface, 0xFFECECF4)
    int cardBg = withAlpha(surfaceColor, percent(c.bg_card_alpha, 100))
    int floatBg = withAlpha(surfaceColor, percent(c.bg_float_alpha, 92))
    int success = parseColor(c.success, 0xFF08CA2C)

    return [
            bg_body          : toHex(parseColor(c.bg_body, 0xFFFAF8FF)),
            bg_surface       : toHex(cardBg),
            bg_card          : toHex(cardBg),
            bg_float         : toHex(floatBg),
            // (card_category_bg / card_category_text 已按用户要求移除:这两个键从未接到任何组件)
            // 正文颜色与主色共用同一个值(资源名 text_main 保留,但主题文件里已没有这个键)
            text_main        : toHex(brand),
            text_sub         : toHex(textSub),
            text_hint        : toHex(textHint),
            text_main_half   : toHex(textMainHalf),
            text_disable     : toHex(textSub),
            text_accent   : toHex(brand),
            text_highlight      : toHex(highlightText),
            color_highlight  : toHex(brand),
            select_fill      : toHex(brand),
            press_overlay    : toHex(withAlpha(brand, 0.24f)),
            btn_confirm_bg   : toHex(confirmBg),
            btn_confirm_text : toHex(confirmText),
            btn_cancel_bg    : toHex(hollowStroke),
            btn_plain_text   : toHex(brand),
            btn_select_bg    : toHex(confirmBg),
            btn_select_text  : toHex(confirmText),
            btn_select_stroke: toHex(confirmBg),
            btn_stroke       : toHex(hollowStroke),
            switch_track_on  : toHex(success),
            // 「开关-关」不再单独配(2026-10-01,用户口径"开关关闭颜色不自定义,改成开关开启色 透明度30%,
            // 同时移除主题配置里的开关-关选项"):派生自开关开启色(success)的 30% 透明;
            // 主题文件里那个 switch_track_off 键已删,编辑器也不再列它(见 ThemeSpec:它不再是配置项)。
            switch_track_off : toHex(withAlpha(success, 0.30f)),
            switch_thumb     : toHex(parseColor(c.switch_thumb, 0xFFFFFFFF)),
            download_active  : toHex(parseColor(c.download_active, 0xFF037AFF)),
            download_done    : toHex(success)
    ]
}

// 圆角键:只认默认表里的键(数值单位固定为 dp,JSON 不带 "dp" 后缀);desc:每个键一句说明(与颜色文件同一套约定 ——
// 写进生成的 theme_radii.xml 行尾注释,以后做"自定义主题"界面时就是每个圆角项下面的说明)。
// 手改文件写错键名/漏写说明都会 WARN,和 readTheme 一个口径。
static def readRadii(def file, def defaults) {
    def radii = new LinkedHashMap(defaults)
    def desc = [:]
    if (!file.exists()) return [radii: radii, desc: desc]
    try {
        // 必须显式按 UTF-8 读(desc 里有中文,走平台默认编码在 Windows 下会读成乱码)
        def json = new groovy.json.JsonSlurper().parseText(file.getText('UTF-8'))
        radii.each { k, v ->
            def uv = json[k]
            if (uv instanceof Number) {
                float n = ((Number) uv).floatValue()
                float max = (k == 'radius_widget_btn') ? 17f : (k.startsWith('stroke_') ? 8f : 64f)
                if (Float.isFinite(n) && n >= 0f && n <= max) {
                    radii[k] = n
                } else if (Float.isFinite(n) && n > 0f && max < 64f) {
                    // **超上限就夹到上限,不许原样放行**:运行期 ThemeShapePalette 对同一批键也有上限
                    // (radius_widget_btn ≤ 17 —— 键高 34dp,超过半高只会饱和成胶囊;描边 ≤ 8)。
                    // 两边不一致会出现"内置主题(编译期资源)画 26dp、自定义主题(运行时调色板)画 17dp",
                    // 同一个 App 两套圆角。这里夹到与运行时同值,ThemePillShapeContractTest 也据此守住。
                    println "WARN: ${file.name} 的 ${k}=${n} 超过上限 ${max},已夹到 ${max}(与运行时同口径)"
                    radii[k] = max
                }
            }
        }
        // type=主题元信息、desc=说明:不参与派生,也不该被"不认识的键"告警误伤
        def unknown = json.keySet().findAll { it != 'type' && it != 'desc' && !defaults.containsKey(it) }
        if (unknown) println "WARN: ${file.name} 里有不认识的键(已忽略): ${unknown.join(', ')}"
        def d = json['desc']
        if (d instanceof Map) d.each { k, v -> if (v instanceof String) desc[k] = v }
        def staleDesc = desc.keySet().findAll { !defaults.containsKey(it) }
        if (staleDesc) println "WARN: ${file.name} 的 desc 里有不存在的键: ${staleDesc.join(', ')}"
        def noDesc = defaults.keySet().findAll { !desc.containsKey(it) }
        if (noDesc) println "WARN: ${file.name} 的 desc 缺少这些键的说明: ${noDesc.join(', ')}"
    } catch (Throwable th) {
        println "WARN: ${file.name} 解析失败,使用默认圆角: ${th.message}"
    }
    return [radii: radii, desc: desc]
}

/** 写出颜色资源;desc 命中时在行尾带一条说明注释(方便直接看生成的 theme_colors.xml 知道每行是啥) */
static def writeColorsXml(def dir, def name, def colors, def desc) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_colors.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    colors.each { k, v ->
        def note = (desc && desc[k]) ? "  <!-- ${desc[k]} -->" : ''
        sb.append("    <color name=\"${k}\">${v}</color>${note}\n")
    }
    sb.append('</resources>\n')
    f.setText(sb.toString(), 'UTF-8')   // 注释里有中文,必须显式 UTF-8 落盘(别用平台默认编码)
}

static def writeRadiiXml(def dir, def name, def radii, def desc) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_radii.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    radii.each { k, v ->
        def note = (desc && desc[k]) ? "  <!-- ${desc[k]} -->" : ''
        sb.append("    <dimen name=\"${k}\">${v}dp</dimen>${note}\n")
    }
    sb.append('</resources>\n')
    f.setText(sb.toString(), 'UTF-8')   // 注释里有中文,必须显式 UTF-8 落盘(别用平台默认编码)
}

/**
 * 写出派生好的调色板(主题文件里不存在的键由 derivePalette 算出来),供<b>运行时</b>读取。
 *
 * 为什么要把派生结果也打成 assets:内置主题的首帧颜色来自编译期资源,自定义主题的颜色由运行期
 * 按同一套规则重算(common 的 ThemePaletteFactory)。两边规则一旦漂移,用户就会看到"自定义主题的
 * 按钮描边/选中态跟内置主题不是一个算法"。把 Gradle 的派生结果落成文件后,单测
 * (ThemeDerivationParityTest)就能拿它跟运行期算法的结果逐键比对,漂移当场变红。
 */
static def writeDerivedJson(def dir, def name, def colors) {
    def valuesDir = new File(dir, 'theme/generated')
    valuesDir.mkdirs()
    def f = new File(valuesDir, "${name}.json")
    def sb = new StringBuilder('{\n')
    def keys = colors.keySet().toList()
    keys.eachWithIndex { k, i ->
        sb.append("  \"${k}\": \"${colors[k]}\"").append(i == keys.size() - 1 ? '\n' : ',\n')
    }
    sb.append('}\n')
    f.setText(sb.toString(), 'UTF-8')
}

/** theme_shapes.json 是形状结构的唯一来源:同一份数据同时生成首帧 XML 与运行时配方表。 */
static def writeThemeShapes(def source, def resDir, def assetsDir) {
    if (!source.exists()) throw new GradleException("缺少主题形状配方:${source}")
    def recipes = new groovy.json.JsonSlurper().parseText(source.getText('UTF-8'))
    if (!(recipes instanceof Map)) throw new GradleException('theme_shapes.json 顶层必须是对象')
    def drawableDir = new File(resDir, 'drawable')
    drawableDir.mkdirs()
    // 配方改名或移除后清掉旧产物，否则旧 XML 还会参与资源合并并与手写 drawable 重名。
    drawableDir.listFiles()?.each { File generated ->
        if (generated.isFile() && generated.name.endsWith('.xml')
                && !recipes.containsKey(generated.name.substring(0, generated.name.length() - 4))
                && !generated.delete()) {
            throw new GradleException("无法清理过期主题形状资源:${generated}")
        }
    }

    def colorRef = { value ->
        if (value == null || value == 'transparent') return '@android:color/transparent'
        String text = value.toString()
        return text.startsWith('#') || text.startsWith('@') ? text : "@color/${text}"
    }
    def dimRef = { Map recipe, String tokenKey, String dpKey ->
        if (recipe[tokenKey] instanceof String) return "@dimen/${recipe[tokenKey]}"
        if (recipe[dpKey] instanceof Number) return "${recipe[dpKey]}dp"
        return null
    }
    def shapeXml = { Map recipe, Map state ->
        // 形状:默认矩形;oval 用于圆形悬浮钮(bg_fab_oval)。两种写法必须与运行时
        // ThemeDrawableFactory 一致,否则编译期首帧与换肤后是两个形状。
        String shapeName = (recipe.shape instanceof String) ? recipe.shape.toString() : 'rectangle'
        if (!(shapeName in ['rectangle', 'oval'])) {
            throw new GradleException("不支持的 android:shape:${shapeName}(只允许 rectangle / oval)")
        }
        def lines = ["<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"${shapeName}\">"]
        lines << "    <solid android:color=\"${colorRef(state.fill)}\" />"
        def width = dimRef(recipe, 'strokeWidth', 'strokeWidthDp')
        if (state.stroke != null && width != null) {
            lines << "    <stroke android:width=\"${width}\" android:color=\"${colorRef(state.stroke)}\" />"
        }
        if (shapeName == 'rectangle') {
            if (recipe.radius instanceof String) {
                lines << "    <corners android:radius=\"@dimen/${recipe.radius}\" />"
            } else if (recipe.corners instanceof Map) {
                Map c = (Map) recipe.corners
                def corner = { String token, String dp ->
                    if (c[token] instanceof String) return "@dimen/${c[token]}"
                    if (c[dp] instanceof Number) return "${c[dp]}dp"
                    return '0dp'
                }
                lines << '    <corners'
                lines << "        android:topLeftRadius=\"${corner('topLeft', 'topLeftDp')}\""
                lines << "        android:topRightRadius=\"${corner('topRight', 'topRightDp')}\""
                lines << "        android:bottomRightRadius=\"${corner('bottomRight', 'bottomRightDp')}\""
                lines << "        android:bottomLeftRadius=\"${corner('bottomLeft', 'bottomLeftDp')}\" />"
            }
        }
        lines << '</shape>'
        return lines.join('\n')
    }
    def stateAttrs = [selected: 'android:state_selected="true"', pressed: 'android:state_pressed="true"',
                      disabled: 'android:state_enabled="false"', checked: 'android:state_checked="true"',
                      focused: 'android:state_focused="true"']
    recipes.each { id, raw ->
        if (!(id ==~ /[a-z0-9_]+/) || !(raw instanceof Map)) {
            throw new GradleException("非法主题配方 id:${id}")
        }
        Map recipe = (Map) raw
        Map states = recipe.states instanceof Map ? (Map) recipe.states : [:]
        if (!states.containsKey('default')) throw new GradleException("主题配方 ${id} 缺 default 状态")
        String body
        if (states.size() == 1) {
            body = shapeXml(recipe, (Map) states.default)
        } else {
            def order = ['disabled', 'selected', 'checked', 'focused', 'pressed', 'default']
            def lines = ['<selector xmlns:android="http://schemas.android.com/apk/res/android">']
            order.each { stateName ->
                if (!states.containsKey(stateName)) return
                String attrs = stateName == 'default' ? '' : ' ' + stateAttrs[stateName]
                lines << "    <item${attrs}>"
                shapeXml(recipe, (Map) states[stateName]).split('\n').each { lines << '        ' + it }
                lines << '    </item>'
            }
            lines << '</selector>'
            body = lines.join('\n')
        }
        new File(drawableDir, "${id}.xml").setText('<?xml version="1.0" encoding="utf-8"?>\n' + body + '\n', 'UTF-8')
    }

    def runtimeDir = new File(assetsDir, 'theme/radius')
    runtimeDir.mkdirs()
    def runtime = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipes)) + '\n'
    new File(runtimeDir, 'theme_shapes_runtime.json').setText(runtime, 'UTF-8')
}

task generateThemeColors {
    inputs.dir(themePresetDir)
    inputs.file(themeRadiiFile).optional()
    inputs.file(themeShapesFile)
    outputs.dir(themeColorsDir)
    outputs.dir(themeShapesDir)
    outputs.dir(themeAssetsDir)
    // 派生项的内置说明(主题文件的 desc 里没有这些键,因为它们不占配置):写进生成 XML 的注释里
    def derivedNotes = [
            bg_card        : '页面层:同 bg_surface 的颜色 + bg_card_alpha 的透明度(海报占位/筛选块/卡片里的行)',
            bg_float       : '浮层:同 bg_surface 的颜色 + bg_float_alpha 的透明度(弹窗/抽屉/气泡/悬浮钮)',
            switch_track_on: '同 success(开关打开的正向状态色)',
            switch_track_off: '同开关开启色 @30% 透明(派生值;2026-10-01 起不再单独配)',
            download_done  : '同 success(下载完成的正向状态色)',
            color_highlight: '派生自 brand(全局高亮填充)',
            select_fill    : '派生自 brand(勾选框填充)',
            press_overlay  : '派生自 brand @24%(通用按下态覆盖色)',
            text_sub       : '派生自文字主色 @60%(次要文字:说明/描述/副标题)',
            text_hint      : '派生自文字主色 @40%(占位/提示文字:搜索框的「搜索」、输入框提示)',
            text_main_half : '派生自文字主色 @50%(链接/地址这类要与主色同系但压一档的文字)',
            text_disable   : '派生自文字主色 @60%(禁用文字;与次要文字同值)',
            text_accent    : '同 brand 文字主色(标题与普通选中文字)',
            btn_plain_text : '派生自 brand 文字主色(空心按钮/纯文字按钮的文字)',
            btn_select_bg  : '同 btn_confirm_bg(主按钮、小组件、直播选中项的实心填充)',
            btn_select_text: '同 btn_confirm_text(实心填充上的文字)',
            btn_select_stroke: '同 btn_confirm_bg(实心填充的描边)',
            btn_stroke     : '同 btn_cancel_bg(无文字描边容器与输入框用;历史资源名)'
    ]
    doLast {
        // 输出目录每次重建,避免迁移前的旧派生 JSON 被继续打进 APK。
        project.delete(themeAssetsDir)
        def light = readTheme(defaultThemeFile(themePresetDir, 'bright'), defaultLightColors)
        def night = readTheme(defaultThemeFile(themePresetDir, 'dark'), defaultNightColors)
        // 两套主题的键、说明都应当一致(同一批概念):不一致 = 改了一边忘了另一边
        def descDiff = (light.desc.keySet() + night.desc.keySet()).unique().findAll { light.desc[it] != night.desc[it] }
        if (descDiff) println "WARN: 两个主题文件的 desc 不一致(同一个键应同一说明): ${descDiff.join(', ')}"
        def lightNotes = new LinkedHashMap(derivedNotes); lightNotes.putAll(light.desc)
        def nightNotes = new LinkedHashMap(derivedNotes); nightNotes.putAll(night.desc)
        writeColorsXml(themeColorsDir, 'values', derivePalette(light.colors), lightNotes)
        writeColorsXml(themeColorsDir, 'values-night', derivePalette(night.colors), nightNotes)
        def radiiRead = readRadii(themeRadiiFile, defaultRadii)
        writeRadiiXml(themeColorsDir, 'values', radiiRead.radii, radiiRead.desc)
        // 运行时可读的派生结果(内置调色板的权威来源 + 单测对比基准)
        writeDerivedJson(themeAssetsDir, 'theme_derived_bright', derivePalette(light.colors))
        writeDerivedJson(themeAssetsDir, 'theme_derived_dark', derivePalette(night.colors))
        writeThemeShapes(themeShapesFile, themeShapesDir, themeAssetsDir)
    }
}
preBuild.dependsOn generateThemeColors

// 节日显示名允许公历/农历自然撞日；同一历法重复写同一个日期则在打包前直接失败。
// 这里校验 JSON 定义本身，不依赖 app 编译/单测，因此 debug 和 release 的 preBuild 都会执行。
def holidayCatalogAsset = file('src/main/assets/calendar/holidays.json')
tasks.register('validateHolidayCatalog') {
    inputs.file(holidayCatalogAsset)
    doLast {
        def root = new groovy.json.JsonSlurper().parseText(holidayCatalogAsset.getText('UTF-8'))
        if (!(root instanceof Map) || root.version != 1 || !(root.holidays instanceof List)) {
            throw new GradleException('节日 JSON 必须包含 version=1 与 holidays 数组')
        }
        def visible = []
        root.holidays.eachWithIndex { holiday, index ->
            if (!(holiday instanceof Map) || !(holiday.display instanceof Boolean)) {
                throw new GradleException("节日 JSON 第 ${index + 1} 条缺少布尔 display")
            }
            if (!holiday.display) return
            def id = holiday.id ?: "第 ${index + 1} 条"
            if (!(holiday.type in ['solar', 'lunar']) || !(holiday.month instanceof Integer)
                    || holiday.month < 1 || holiday.month > 12) {
                throw new GradleException("节日 ${id} 的 type/month 无效")
            }
            if (holiday.dateRule == 'fixed') {
                if (!(holiday.day instanceof Integer) || !(holiday.endDay instanceof Integer)
                        || holiday.day < 1 || holiday.endDay > 31 || holiday.day > holiday.endDay) {
                    throw new GradleException("节日 ${id} 的 fixed 日期区间无效")
                }
            } else if (holiday.dateRule == 'last_day') {
                if (holiday.day != 0 || holiday.endDay != 0) {
                    throw new GradleException("节日 ${id} 的 last_day 须使用 day=endDay=0")
                }
            } else if (holiday.dateRule == 'solar_term') {
                if (holiday.type != 'solar' || holiday.day != 0 || holiday.endDay != 0
                        || !(holiday.term instanceof String) || holiday.term.trim().isEmpty()) {
                    throw new GradleException("节日 ${id} 的 solar_term 定义无效")
                }
            } else {
                throw new GradleException("节日 ${id} 的 dateRule 无效")
            }
            visible.each { prior ->
                if (prior.type != holiday.type) return
                boolean duplicate = false
                if (prior.dateRule == 'solar_term' && holiday.dateRule == 'solar_term') {
                    duplicate = prior.term == holiday.term
                } else if (prior.month == holiday.month) {
                    if (prior.dateRule == 'fixed' && holiday.dateRule == 'fixed') {
                        duplicate = prior.day <= holiday.endDay && holiday.day <= prior.endDay
                    } else if (prior.dateRule == 'last_day' && holiday.dateRule == 'last_day') {
                        duplicate = true
                    } else if ((prior.dateRule == 'fixed' && holiday.dateRule == 'last_day')
                            || (prior.dateRule == 'last_day' && holiday.dateRule == 'fixed')) {
                        def fixed = prior.dateRule == 'fixed' ? prior : holiday
                        def possibleLastDays = holiday.type == 'lunar' ? [29, 30]
                                : holiday.month == 2 ? [28, 29]
                                : holiday.month in [4, 6, 9, 11] ? [30] : [31]
                        duplicate = possibleLastDays.any { fixed.day <= it && it <= fixed.endDay }
                    }
                }
                if (duplicate) {
                    throw new GradleException("同一历法的节日显示日期重复: ${prior.id} 与 ${id}"
                            + " (${holiday.type} ${holiday.month} 月)")
                }
            }
            visible << holiday
        }
    }
}
preBuild.dependsOn validateHolidayCatalog
android.sourceSets.main.res.srcDirs += themeColorsDir
android.sourceSets.main.res.srcDirs += themeShapesDir
