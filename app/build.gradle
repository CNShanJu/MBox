// ------------------------------------------------------------------
// 主题颜色生成:扫描 assets/theme/themes/{bright,dark}/,每类恰好一份 default=true。
// 默认预设生成 res/values 与 res/values-night,其它预设随 assets 打包供运行时选择。
// 每个文件自包含、**每个概念一个键**(底色/各种面+各自的透明度/各级文字色/品牌色/按钮色板/开关/状态色),
// 只有"和主色同值的别名"不写进文件,由下面的规则表派生(原文件里同一主题内浅色 #1F2937 重复 9 次、
// #ECECF4 重复 5 次那类)。文件不存在时用内置默认值。
// ------------------------------------------------------------------
def themePresetDir = file('src/main/assets/theme/themes')
def themeRadiiFile = file('src/main/assets/theme/radius/theme_radii.json')
def themeShapesFile = file('src/main/assets/theme/radius/theme_shapes.json')
def themeColorsDir = file("${buildDir}/generated/theme_colors")
def themeShapesDir = file("${buildDir}/generated/theme_shapes")
// 生成的主题资产目录(theme_derived_*.json):作为额外的 assets 源目录合并进 assets/theme/
def themeAssetsDir = file("${buildDir}/generated/theme_assets")

def defaultRadii = [
        // 圆角文件(assets/theme/radius/theme_radii.json)缺失时的兜底:必须与仓库内那份同值。
        // 原来这里写的是 25dp —— 主题文件一旦缺失/解析失败,全站圆角会突然变成 25dp
        // (小件的圆角超过半高就会被 GradientDrawable 缩成胶囊,而且不会有任何报错)。
        // 注意:readRadii() 只认**这张表里有的键**(JSON 里多出来的键会 WARN 并忽略),
        // 所以新增一个圆角档位必须同时加在这里,否则 @dimen/xxx 根本不会生成。
        radius_background: 26,
        radius_dialog    : 20,
        radius_card      : 18,
        radius_btn       : 24,
        // 小组件按钮高 34dp:0～15dp 是普通圆角,16dp 接近胶囊,17dp 是标准胶囊。
        // 编辑器允许并原样保存 0～17dp；超过半高只会饱和,不应靠裁剪制造不对称圆角。
        radius_widget_btn: 26,
        // "小件档":空心/实心小按钮(bg_r_common_*)、筛选抽屉里的选项、视频详情抽屉里的内块、
        // 本地视频行这些**抽屉/弹窗里面的小元素**。
        // 它原来写死在 res/values/dimens.xml(8dp),主题文件根本管不到 —— 用户把面板档调到 16dp 后,
        // 抽屉里这些块还是 8dp,观感就是"同一个抽屉有些圆有些方",而且怎么改 theme_radii.json 都不动。
        // 收进这张表后:**全 App 的圆角只剩 theme_radii.json 一个来源**。
        common_corners   : 26,
        // 小组件按钮的**边框线粗细**(底 = selector_widget_btn,圆角档 = radius_widget_btn)。
        // 这类键文字只有 12~13sp,1dp 在高密度屏上是一条 3px 实线,整排键看着"边框又粗又重"
        // (用户口径"radius_widget_btn 边框线太粗了");0.5dp 走抗锯齿,是发丝线观感
        // —— 与输入框那条底线(theme_input_underline,同一个口径)一致。
        stroke_widget_btn: 0.5,
        // 搜索框专用(首页那条胶囊造型的搜索条):独立一档,不跟面板档走
        radius_search    : 26,
        // **缩略图专用**(2026-10-01):「下载页小封面」与「本地视频行的小图」这两处的图。
        // 它们以前跟卡片档走(radius_card):面板档一调大,56×74dp 的小封面圆角就吃掉大半个边,
        // 观感是"小图被切成了圆片"(用户口径"小图片的圆角太大了")。
        // 单独立档后可以只调它、与卡片/抽屉/按钮互不影响;默认 12dp。
        // **刻意不进主题编辑器的界面**(用户口径"主题配置里不给圆角配置选项"):要改就改
        // assets/theme/radius/theme_radii.json(或自定义主题 JSON)的 radius_thumb。
        radius_thumb     : 12
]

// 主题文件缺失时的兜底(与仓库内文件同值)
def defaultLightColors = [
        bg_body: '#faf8ff',
        bg_surface: '#ECECF4', bg_float_alpha: 92, bg_card_alpha: 60,
        text_highlight: '#1890FF',
        brand: '#1F2937',
        btn_confirm_bg: '#1F2937',
        btn_confirm_text: '#FFFFFF',
