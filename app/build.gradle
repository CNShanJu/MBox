// ---- 读取主题文件 ----
// 颜色键:只认默认表里的键(类型按默认值);desc:每个键一句说明(可选,写进生成的 XML 注释,
// 将来做"用户自定义主题"界面时就是每个色块下面的说明文字)。手改文件写错键名/漏写说明都会 WARN。
static def readTheme(def file, def defaults) {
    def colors = new LinkedHashMap(defaults)
    def desc = [:]
    if (!file.exists()) return [colors: colors, desc: desc]
    try {
        // 必须显式按 UTF-8 读:主题文件里有中文说明(desc),走平台默认编码(Windows 下可能是 GBK)会读成乱码
        def json = new groovy.json.JsonSlurper().parseText(file.getText('UTF-8'))
        colors.each { k, v ->
            def uv = json[k]
            if (v instanceof Number) {
                if (uv instanceof Number) colors[k] = ((Number) uv).intValue()
            } else if (uv instanceof String && uv.startsWith('#')) {
                colors[k] = uv
            }
        }
        // 非颜色键(type=主题元信息、desc=说明)不参与派生,也不该被"不认识的键"告警误伤
        def unknown = json.keySet().findAll { it != 'type' && it != 'desc' && !defaults.containsKey(it) }
        if (unknown) println "WARN: ${file.name} 里有不认识的键(已忽略): ${unknown.join(', ')}"
        def d = json['desc']
        if (d instanceof Map) d.each { k, v -> if (v instanceof String) desc[k] = v }
        def staleDesc = desc.keySet().findAll { !defaults.containsKey(it) }
        if (staleDesc) println "WARN: ${file.name} 的 desc 里有不存在的键: ${staleDesc.join(', ')}"
        def noDesc = defaults.keySet().findAll { !desc.containsKey(it) }
        if (noDesc) println "WARN: ${file.name} 的 desc 缺少这些键的说明: ${noDesc.join(', ')}"
    } catch (Throwable th) {
        println "WARN: ${file.name} 解析失败,使用内置默认颜色: ${th.message}"
    }
    return [colors: colors, desc: desc]
}

/** '#RRGGBB' / '#AARRGGBB' -> 0xAARRGGBB;非法值回退 fallback(入参用 def:Groovy 把 8 位十六进制字面量当 Long) */
static int parseColor(def value, def fallback) {
    int fb = ((Number) fallback).intValue()
    if (!(value instanceof String)) return fb
    String hex = ((String) value).trim().replace('#', '')
    try {
        if (hex.length() == 6) return (int) (0xFF000000L | Long.parseLong(hex, 16))
        if (hex.length() == 8) return (int) Long.parseLong(hex, 16)
    } catch (Throwable ignored) {
    }
    return fb
}

/** 写出 '#RRGGBB'(不透明)或 '#AARRGGBB'(带透明度) */
static String toHex(def argbRaw) {
    int argb = ((Number) argbRaw).intValue()
    return ((argb >>> 24) & 0xFF) == 0xFF
            ? String.format('#%06X', argb & 0xFFFFFF)
            : String.format('#%08X', argb)
}

/** 透明度百分比(0-100)-> 0..1;入参用 def 再归一化(Groovy 数字字面量可能是 Long/BigDecimal,写死形参会签名不匹配) */
static float percent(def value, def fallback) {
    int p = (value instanceof Number) ? ((Number) value).intValue() : ((Number) fallback).intValue()
    return Math.max(0, Math.min(100, p)) / 100f
}

static int withAlpha(def colorRaw, def alphaRaw) {
    int color = ((Number) colorRaw).intValue()
    int a = Math.round(Math.max(0f, Math.min(1f, ((Number) alphaRaw).floatValue())) * 255f)
    return (a << 24) | (color & 0xFFFFFF)
}

// ---- 派生规则表 ----
// 面:**颜色只有一个**(bg_surface),页面层与浮层共用,避免同屏深浅不一;
//   **透明度是两档,分层不同**(用户口径,原来接反过一次):
//     bg_card_alpha  → **页面层**:bg_surface(页面卡片·标题栏·底栏·搜索框)、
//                      bg_card(海报占位、筛选块、以及**卡片里面的行** —— 弹窗列表行 bg_small_round_gray 等);
//     bg_float_alpha → **浮层**:bg_float(所有弹窗与抽屉、长按/上次看到的气泡、首页直播·筛选悬浮钮与更新悬浮圈)。
//   一句话:页面上的东西(含卡片里的 item)跟 bg_card_alpha;浮起来的那一层跟 bg_float_alpha。
// 同值别名(不占配置):
//   color_highlight / select_fill / btn_plain_text / btn_select_bg = brand
//     (全局高亮填充=chip/进度条/悬浮圈、勾选框填充、无背景按钮文字、选中按钮填充 —— 设计上就与主色同色)
//   btn_select_text = brand_text(选中填充上的文字)
//   btn_stroke      = brand @40%(无填充按钮的描边)
//   switch_track_on = download_done = success(正向状态色:开关打开 / 下载完成 —— 原本是两个键,值一直相同)
// 不派生的固定色:text_danger / swipe_red / swipe_red_text 已写死在 res/values/colors.xml(不随主题)
static def derivePalette(def c) {
    int brand = parseColor(c.brand, 0xFF1F2937)
    int brandText = parseColor(c.brand_text, 0xFFFFFFFF)
    // 同一个颜色、两档透明度:页面层(bg_card_alpha)与浮层(bg_float_alpha)
    int surfaceColor = parseColor(c.bg_surface, 0xFFECECF4)
    int cardBg = withAlpha(surfaceColor, percent(c.bg_card_alpha, 100))
    int floatBg = withAlpha(surfaceColor, percent(c.bg_float_alpha, 92))
    int success = parseColor(c.success, 0xFF08CA2C)

    return [
            bg_body          : toHex(parseColor(c.bg_body, 0xFFFAF8FF)),
            bg_surface       : toHex(cardBg),
            bg_card          : toHex(cardBg),
            bg_float         : toHex(floatBg),
            // 正文颜色与主色共用同一个值(资源名 text_main 保留,但主题文件里已没有这个键)
            text_main        : toHex(brand),
            text_sub         : toHex(parseColor(c.text_sub, 0xFF787878)),
            text_hint        : toHex(parseColor(c.text_hint, 0xFF611C1B1F)),
            text_disable     : toHex(parseColor(c.text_disable, 0xFFB3B3B3)),
            text_accent   : toHex(parseColor(c.text_accent, brand)),
            text_highlight      : toHex(parseColor(c.text_highlight, 0xFF1890FF)),
            color_highlight  : toHex(brand),
            select_fill      : toHex(brand),
            btn_confirm_bg   : toHex(parseColor(c.btn_confirm_bg, brand)),
            btn_confirm_text : toHex(parseColor(c.btn_confirm_text, brandText)),
            btn_cancel_bg    : toHex(parseColor(c.btn_cancel_bg, 0x00000000)),
            btn_cancel_text  : toHex(parseColor(c.btn_cancel_text, brand)),
            btn_plain_text   : toHex(brand),
            btn_select_bg    : toHex(brand),
            btn_select_text  : toHex(brandText),
            btn_stroke       : toHex(withAlpha(brand, 0.4f)),
            switch_track_on  : toHex(success),
            switch_track_off : toHex(parseColor(c.switch_track_off, brand)),
            switch_thumb     : toHex(parseColor(c.switch_thumb, 0xFFFFFFFF)),
            download_active  : toHex(parseColor(c.download_active, 0xFF037AFF)),
            download_done    : toHex(success)
    ]
}

static def readRadii(def file, def defaults) {
    def radii = new LinkedHashMap(defaults)
    if (file.exists()) {
        try {
            def json = new groovy.json.JsonSlurper().parseText(file.getText('UTF-8'))
            radii.each { k, v ->
                def uv = json[k]
                if (uv instanceof String && (uv.endsWith('dp') || uv.endsWith('dip') || uv.endsWith('px'))) {
                    radii[k] = uv
                }
            }
        } catch (Throwable th) {
            println "WARN: ${file.name} 解析失败,使用默认圆角: ${th.message}"
        }
    }
    return radii
}

/** 写出颜色资源;desc 命中时在行尾带一条说明注释(方便直接看生成的 theme_colors.xml 知道每行是啥) */
static def writeColorsXml(def dir, def name, def colors, def desc) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_colors.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    colors.each { k, v ->
        def note = (desc && desc[k]) ? "  <!-- ${desc[k]} -->" : ''
        sb.append("    <color name=\"${k}\">${v}</color>${note}\n")
    }
    sb.append('</resources>\n')
    f.setText(sb.toString(), 'UTF-8')   // 注释里有中文,必须显式 UTF-8 落盘(别用平台默认编码)
}

static def writeRadiiXml(def dir, def name, def radii) {
    def valuesDir = new File(dir, name)
    valuesDir.mkdirs()
    def f = new File(valuesDir, 'theme_radii.xml')
    def sb = new StringBuilder('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n')
    radii.each { k, v -> sb.append("    <dimen name=\"${k}\">${v}</dimen>\n") }
    sb.append('</resources>\n')
    f.setText(sb.toString(), 'UTF-8')
}

/**
 * 写出派生好的调色板(主题文件里不存在的键由 derivePalette 算出来),供<b>运行时</b>读取。
 *
 * 为什么要把派生结果也打成 assets:内置主题的首帧颜色来自编译期资源,自定义主题的颜色由运行期
 * 按同一套规则重算(common 的 ThemePaletteFactory)。两边规则一旦漂移,用户就会看到"自定义主题的
 * 按钮描边/选中态跟内置主题不是一个算法"。把 Gradle 的派生结果落成文件后,单测
 * (ThemeDerivationParityTest)就能拿它跟运行期算法的结果逐键比对,漂移当场变红。
 */
static def writeDerivedJson(def dir, def name, def colors) {
    def valuesDir = new File(dir, 'theme')
    valuesDir.mkdirs()
    def f = new File(valuesDir, "${name}.json")
    def sb = new StringBuilder('{\n')
    def keys = colors.keySet().toList()
    keys.eachWithIndex { k, i ->
        sb.append("  \"${k}\": \"${colors[k]}\"").append(i == keys.size() - 1 ? '\n' : ',\n')
    }
    sb.append('}\n')
    f.setText(sb.toString(), 'UTF-8')
}

task generateThemeColors {
    inputs.file(themeColorsFile).optional()
    inputs.file(themeColorsNightFile).optional()
    inputs.file(themeRadiiFile).optional()
    outputs.dir(themeColorsDir)
    outputs.dir(themeAssetsDir)
    // 派生项的内置说明(主题文件的 desc 里没有这些键,因为它们不占配置):写进生成 XML 的注释里
    def derivedNotes = [
            bg_card        : '页面层:同 bg_surface 的颜色 + bg_card_alpha 的透明度(海报占位/筛选块/卡片里的行)',
            bg_float       : '浮层:同 bg_surface 的颜色 + bg_float_alpha 的透明度(弹窗/抽屉/气泡/悬浮钮)',
            switch_track_on: '同 success(开关打开的正向状态色)',
            download_done  : '同 success(下载完成的正向状态色)',
            color_highlight: '派生自 brand(全局高亮填充)',
            select_fill    : '派生自 brand(勾选框填充)',
            btn_plain_text : '派生自 brand(无背景按钮文字)',
            btn_select_bg  : '派生自 brand(选中按钮/chip 填充)',
            btn_select_text: '派生自 brand_text(选中填充上的文字)',
            btn_stroke     : '派生自 brand @40%(无填充按钮的描边)'
    ]
    doLast {
        def light = readTheme(themeColorsFile, defaultLightColors)
        def night = readTheme(themeColorsNightFile, defaultNightColors)
        // 两套主题的键、说明都应当一致(同一批概念):不一致 = 改了一边忘了另一边
        def descDiff = (light.desc.keySet() + night.desc.keySet()).unique().findAll { light.desc[it] != night.desc[it] }
        if (descDiff) println "WARN: 两个主题文件的 desc 不一致(同一个键应同一说明): ${descDiff.join(', ')}"
        def lightNotes = new LinkedHashMap(derivedNotes); lightNotes.putAll(light.desc)
        def nightNotes = new LinkedHashMap(derivedNotes); nightNotes.putAll(night.desc)
        writeColorsXml(themeColorsDir, 'values', derivePalette(light.colors), lightNotes)
        writeColorsXml(themeColorsDir, 'values-night', derivePalette(night.colors), nightNotes)
        writeRadiiXml(themeColorsDir, 'values', readRadii(themeRadiiFile, defaultRadii))
        // 运行时可读的派生结果(内置调色板的权威来源 + 单测对比基准)
        writeDerivedJson(themeAssetsDir, 'theme_derived_bright', derivePalette(light.colors))
        writeDerivedJson(themeAssetsDir, 'theme_derived_dark', derivePalette(night.colors))
    }
}
preBuild.dependsOn generateThemeColors
android.sourceSets.main.res.srcDirs += themeColorsDir
// 生成的主题资产(assets/theme/theme_derived_*.json)与手写的 assets/theme/*.json 合并进同一个目录
android.sourceSets.main.assets.srcDirs += themeAssetsDir
