plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ------------------------------------------------------------------
// 发布配置:版本号/应用名/图标统一由 app_config.properties 维护,
// 修改该文件后重新构建即可,无需改动 build.gradle 与资源。
// ------------------------------------------------------------------
def appConfig = new Properties()
def appConfigFile = file('app_config.properties')
if (appConfigFile.exists()) {
    appConfigFile.withInputStream { ins ->
        // 跳过 UTF-8 BOM(记事本等工具保存 UTF-8 时可能带 BOM),避免污染第一个键
        ins.mark(3)
        if (ins.read() != 0xEF || ins.read() != 0xBB || ins.read() != 0xBF) {
            ins.reset()
        }
        appConfig.load(new InputStreamReader(ins, 'UTF-8'))
    }
}
def cfgVersionCode = (appConfig.getProperty('versionCode', '41') ?: '41').toInteger()
def cfgVersionName = appConfig.getProperty('versionName', '2.2.0') ?: '2.2.0'
def cfgDebugVersionName = appConfig.getProperty('debugVersionName')?.trim()
if (!cfgDebugVersionName) {
    throw new GradleException('app_config.properties must set debugVersionName to the previous published version')
}
def cfgAppName = appConfig.getProperty('appName', 'MBox') ?: 'MBox'
def cfgAppIcon = appConfig.getProperty('appIcon', '@drawable/app_icon') ?: '@drawable/app_icon'


// ------------------------------------------------------------------
// 主题与公共资源自持(3.7② 建 :ui-common 模块,后已整体并入 :app):
// 主题资源(theme_colors/theme_radii/样式/公共 drawable)与页面级资源现在同在 app 的 res,
// 主题 JSON 统一维护于 app/src/main/assets/theme/。
// ------------------------------------------------------------------
android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        // 专属包名:与 TVBox 系开源应用通用的 com.github.tvbox.osc 区分开,
        // 保证本包可与已安装的其他开源 TVBox 应用共存安装、互不冲突。
        // (namespace 保持不变,代码包/资源引用均不受影响)
        applicationId 'com.github.tvbox.osc.mbox'
        minSdk 24
        targetSdk 34
        versionCode cfgVersionCode
        versionName cfgVersionName
        // 应用名与图标来自 app_config.properties(集中配置)
        resValue "string", "app_name", cfgAppName
        manifestPlaceholders = [appIcon: cfgAppIcon]
        multiDexEnabled true
        // 仅保留中文本地化,减小 APK 体积(未翻译文案自动回退到默认 values/)
        resConfigs 'zh-rCN', 'zh'

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }

    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            // debug 包显示上一版已发布版本，允许跨版本号跳跃后继续检测本次 release。
            String vn = cfgVersionName
            if (variant.buildType.name == buildTypes.debug.getName()) {
                vn = cfgDebugVersionName
                output.versionNameOverride = vn
            }
            outputFileName = cfgAppName + '_v' + vn + '_' + variant.buildType.name
            if (variant.buildType.name == buildTypes.release.getName()) {
                outputFileName += '_' + new Date().format("yyyyMMdd")
            }
            outputFileName += '.apk'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/beans.xml']
        }
    }

    // ------------------------------------------------------------------
    // 签名:密钥一律不入库(见 .gitignore:*.jks / keystore.properties 已忽略)。
    // 本项目正式密钥:仓库根目录 mbox-release.jks(2025 年生成,全新建库,
    //   不再使用 TVBox 开源圈流传/曾泄露的 TVBoxOSC.jks),
    //   本地读取 app/keystore.properties(不入库,storeFile=../mbox-release.jks)。
    // 读取顺序:环境变量 > keystore.properties(不入库) > 默认占位。
    // 任一密钥缺失时自动退回 debug 签名,保证本地/CI 都能出包;
    // 正式发布请在 CI 通过 secret 注入(GitHub Secrets: KEYSTORE_BASE64 /
    //   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,见 .github/workflows/build-apk.yml)。
    // ------------------------------------------------------------------
    def env = System.getenv()
    // 变量刻意不与 signingConfig 属性(storeFile/storePassword/keyAlias/keyPassword)同名,
    // 否则 Groovy DSL 下 `keyAlias keyAlias` 会把同名局部变量当方法调用而报错(曾踩坑)。
    def ksFile = env['KEYSTORE_FILE'] ?: ''
    def ksStorePassword = env['KEYSTORE_PASSWORD'] ?: ''
    def ksKeyAlias = env['KEY_ALIAS'] ?: ''
    def ksKeyPassword = env['KEY_PASSWORD'] ?: ''
    def keystoreProps = file('keystore.properties')
    if (keystoreProps.exists()) {
        def props = new Properties()
        keystoreProps.withInputStream { ins -> props.load(ins) }
        if (ksFile.isEmpty()) ksFile = props.getProperty('storeFile', '')
        if (ksStorePassword.isEmpty()) ksStorePassword = props.getProperty('storePassword', '')
        if (ksKeyAlias.isEmpty()) ksKeyAlias = props.getProperty('keyAlias', '')
        if (ksKeyPassword.isEmpty()) ksKeyPassword = props.getProperty('keyPassword', '')
    }
    def hasSigning = !ksFile.isEmpty() && !ksStorePassword.isEmpty()
            && !ksKeyAlias.isEmpty() && !ksKeyPassword.isEmpty()
    def signFile = hasSigning ? file(ksFile) : null
    def canSign = hasSigning && signFile != null && signFile.exists()

    if (!canSign && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
        println "WARN: 未检测到正式签名密钥(环境变量或 app/keystore.properties 缺失)," +
                "本次 release 将退回 debug 签名(仅测试用,勿对外分发)!"
    }

    signingConfigs {
        config {
            if (canSign) {
                storeFile signFile
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            // 调试包使用独立包名,可与设备上已安装的同包名应用共存(避免签名不一致需卸载旧应用)
            applicationIdSuffix ".debug"
            // 调试包应用名带 " debug" 后缀:桌面图标与首页/我的页标题一眼可辨
            // (resValue 优先级高于 res 文件,此处覆盖 defaultConfig 的 app_name)
            resValue "string", "app_name", cfgAppName + " debug"
        }

        release {
            signingConfig canSign ? signingConfigs.config : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        viewBinding true
    }
}

// ------------------------------------------------------------------
// 打包前清理"不完整的旧 APK"(兜住 Android Studio 的部署优化)
//
// 现象(2026-09-27 用户连报四次,每次一模一样):
//   java.io.IOException: Missing AndroidManifest.xml entry in
//     'app/build/intermediates/apk/debug/MBox_v3.5.9_debug.apk'
// 定位结论:那个文件**不是我们构建出来的** ——
//   · 正常构建只产出 app/build/outputs/apk/<变体>/ 下的完整包(1300+ 条目,含 res/、resources.arsc、
//     AndroidManifest.xml、签名);用 gradlew 删掉 intermediates/apk 后重建,那个目录根本不会再生;
//   · 而 Android Studio 的"部署优化 / Apply Changes"会在 intermediates/apk/<变体>/ 写一个**部署载荷**:
//     实测 149 个条目 = dex(33) + assets(24) + lib(12) + META-INF(69) + kotlin/okhttp 等,
//     **没有 res/、没有 resources.arsc、没有 AndroidManifest.xml、也没有签名**;
//   · AGP 的增量打包把这个载荷当成"上一次打好的包"去做补丁,校验不到 manifest 就抛上面那个 IOException,
//     于是构建直接失败;删掉它下次就好,但 AS 会再写一遍 → 看起来"怎么都修不好"。
//
// 处理:打包任务执行前,凡是"连 AndroidManifest.xml 都没有"的旧 APK 一律删掉,强制整包重打。
// 只删自己变体目录下、且确实缺 manifest 的 APK —— 正常的包一个字节都不动。
// (正本清源还是在 AS 里勾上 Run 配置的 "Always install with package manager(关掉部署优化)";
//  这道兜底是为了"就算忘了勾、或者正在用 Apply Changes,构建也不会因此失败"。)
// ------------------------------------------------------------------
def isIncompleteApk = { File f ->
    if (f == null || !f.isFile() || f.length() == 0L) return false
    try {
        return new java.util.zip.ZipFile(f).withCloseable { zip ->
            zip.getEntry('AndroidManifest.xml') == null
        }
    } catch (Throwable ignored) {
        return true   // 连 zip 都读不开 → 也是坏的
    }
}
// 钩住所有打包任务(packageDebug/packageRelease/packageDebugBundle/...UniversalApk 等):
// Android Studio 点 Run 时驱动的就是这批任务,只是它会额外把 APK 写进 intermediates/apk/<变体>/
// (CLI 构建不写那里 —— 这就是"我这边怎么都复现不出来"的原因)。打之前先扫干净,再让它重新打。
tasks.matching { it.name.startsWith('package') }.configureEach { t ->
    t.doFirst {
        def targets = []
        // ① 任务自己声明的产物(可能是文件,也可能是目录)
        t.outputs.files.each { f ->
            if (f.isDirectory()) { f.listFiles()?.each { c -> targets << c } } else { targets << f }
        }
        // ② 再兜一层固定路径:AS 驱动构建时把包写在这里(所有变体都扫一遍)
        def apkRoot = new File(t.project.layout.buildDirectory.get().asFile, 'intermediates/apk')
        apkRoot.listFiles()?.each { vd ->
            if (vd.isDirectory()) vd.listFiles()?.each { c -> targets << c }
        }
        targets.unique().each { f ->
            if (f != null && f.name.endsWith('.apk') && isIncompleteApk(f)) {
                logger.warn("WARN: 删除不完整的旧 APK(缺 AndroidManifest.xml,通常是 AS 部署优化留下的): ${f}")
                //noinspection ResultOfMethodCallIgnored
                f.delete()
            }
        }
    }
}
// ------------------------------------------------------------------
// 自愈:debug 变体的"编译期资源包"掉了 → 打出来的包没有 res/ 与 resources.arsc
//
// 现象(2026-09-27 实测):app/build/intermediates/processed_res/debug/ 里只剩 output-metadata.json,
// **resources-debug.ap_ 不见了**,而 Gradle 仍认为 processDebugResources 是最新的 ——
// 于是 packageDebug 打出一个 149 条目、没有 AndroidManifest.xml/resources.arsc/res/ 的包
// (体积 42MB 看着正常,装上去却缺资源:圆角、布局、颜色这些**资源层**改动全都不生效)。
// 这类包的成因与上面那条一样:AS 的部署优化/Apply Changes 会把 debug 的资源包挪走/删掉。
//
// 处理:preBuild 时递归扫描 processed_res/<变体>/,哪个变体"目录在、却一个 *.ap_ 都没有",
// 就把那个目录删掉 —— 目录没了,processXxxResources 立刻变成"输出缺失",本次构建自动重跑并补回 .ap_。
// 只在真的缺资源包时动手(正常构建零影响),把"要人工删目录/清缓存"变成自动恢复。
// ------------------------------------------------------------------
def hasProcessedResAp = { File dir ->
    // AGP 把包放在 debug/out/resources-debug.ap_；只看变体目录第一层会误报并反复删掉正常产物。
    fileTree(dir).matching { include '**/*.ap_' }.files.any { it.isFile() }
}
tasks.matching { it.name == 'preBuild' }.configureEach { t ->
    t.doFirst {
        def root = new File(t.project.layout.buildDirectory.get().asFile, 'intermediates/processed_res')
        root.listFiles()?.each { vd ->
            if (vd.isDirectory() && !hasProcessedResAp(vd)) {
                logger.warn("WARN: ${vd.name} 变体的资源包(processed_res/**/*.ap_)不见了 —— 删掉该目录让资源重新编译" +
                        "(否则这次打出来的 APK 会缺 res/ 与 resources.arsc,装到机器上资源层改动全都不生效)")
                //noinspection ResultOfMethodCallIgnored
                vd.deleteDir()
            }
        }
    }
}

