plugins {
    id 'com.android.library'
}

android {
    // 模块与物理目录已从 common 更名对齐 :core-network(namespace 仅为资源生成,无外部引用)
    namespace 'com.github.tvbox.osc.corenetwork'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation project(':log') // 系统配置变更业务日志(LogStore 便捷方法)
    implementation project(':core-storage') // config 包(PrefsDataStore/SystemConfig/HawkConfig)由 core-storage 提供
}
