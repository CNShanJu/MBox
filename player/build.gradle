plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.github.tvbox.osc.player'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSimon.initWith(release)
        releaseSimon {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation project(':common')
    implementation project(':core-storage')
    implementation project(':log')
    // 1.11.1 要求 minCompileSdk=36；compileSdk 已同步升到 36。
    def media3Version = "1.11.1"
    implementation "androidx.annotation:annotation:1.3.0"
    // app 的内核适配器继承 ExoMediaPlayer，暂需暴露其 ExoPlayer/TrackSelector 类型。
    api "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3Version"
    implementation "androidx.media3:media3-datasource-rtmp:$media3Version"
    // IJK 软解移除后，用 jellyfin 的 FFmpeg 音频软解补齐(参照 AVBox，与 Media3 1.11.1 兼容的可用版本为 1.9.0+1)。
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.5'
    testImplementation 'junit:junit:4.13.2'
}
